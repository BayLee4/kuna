name: Tests

# Parity and simulated integration gates run on every event. The workspace and live Java suites run
# for forks, main, manual dispatch, the nightly (which calls this workflow
# whole), or an internal PR carrying full-ci.

on:
  pull_request:
    # `labeled` is here so the `full-ci` escape hatch works by labelling alone.
    # Without it the hatch is a lie: the default set is opened/synchronize/
    # reopened, and re-running a finished run REPLAYS ITS ORIGINAL PAYLOAD -- so
    # a label added afterwards is invisible to the `if:` and you would have to
    # push a commit to be believed. The cost is one extra run per label added to
    # a PR, which is rare here; `unlabeled` is deliberately NOT included, so
    # removing a label does not re-run anything.
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# A new push to a PR supersedes that PR's in-flight run; runs on main are never
# cancelled, so every commit that lands keeps a result of its own. In a called
# workflow `github.workflow` is the CALLER's name, which keeps the nightly's call
# out of the push runs' group: sharing it, a push landing while the nightly's run
# waited would cancel that pending run.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    # Naming bash explicitly is what enables `-o pipefail`; the implicit default
    # (`bash -e`) does not set it, which would let a failing command inside a
    # pipeline report success.
    shell: bash

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  ghidra-live:
    name: installed Ghidra product (macOS ARM64)
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.fork
      || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: macos-latest
    timeout-minutes: 180
    env:
      GHIDRA_VERSION: "12.1.4"
      GHIDRA_ZIP_URL: "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.4_build/ghidra_12.1.4_PUBLIC_20260921.zip"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Install Rust and LLVM fixture tools
        run: |
          test "$(uname -m)" = arm64
          rustup toolchain install stable --profile minimal
          rustup default stable
          brew install llvm lld
          echo "LLVM_BIN=$(brew --prefix llvm)/bin" >> "$GITHUB_ENV"
          echo "KUNA_MATRIX_CROSS_CC=$(brew --prefix llvm)/bin/clang" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: decompiler
          key: ghidra-live-macos-arm64
      - name: Cache qualified Ghidra SDK
        uses: actions/cache@v4
        with:
          path: .ghidra-sdk
          key: ghidra-live-12.1.4-20260921
      - name: Prepare qualified Ghidra and PyGhidra
        run: |
          mkdir -p .ghidra-sdk
          if [ ! -d ".ghidra-sdk/ghidra_${GHIDRA_VERSION}_PUBLIC" ]; then
            curl --fail --location --retry 3 "$GHIDRA_ZIP_URL" -o .ghidra-sdk/sdk.zip
            unzip -q .ghidra-sdk/sdk.zip -d .ghidra-sdk
          fi
          sdk="$PWD/.ghidra-sdk/ghidra_${GHIDRA_VERSION}_PUBLIC"
          python -m pip install "$sdk/Ghidra/Features/PyGhidra/pypkg"
          echo "GHIDRA_INSTALL_DIR=$sdk" >> "$GITHUB_ENV"
      - name: Build native consumers, specs and normal extension ZIP
        run: |
          make binaries specs
          integrations/ghidra/KunaDecompiler/build.sh
          archives=(integrations/ghidra/KunaDecompiler/dist/*.zip)
          test "${#archives[@]}" -eq 1
          echo "KUNA_GHIDRA_EXTENSION_ZIP=$PWD/${archives[0]}" >> "$GITHUB_ENV"
      - name: Run existing consumers against normally installed product
        run: make test-ghidra-live PYTHON=python
      - name: Retain live consumer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ghidra-live-macos-arm64
          path: decompiler/target/ghidra-live

  gates:
    name: parity gates
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          # integrations/web/build.sh generates /dev-viz from git history.
          fetch-depth: 0

      - name: Python tooling unit tests
        run: make test-tools

      - name: Install Rust (stable) + wasm32-wasip1 target
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
          rustup target add wasm32-wasip1

      # Same cache action and workspace the release/pages workflows use.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: decompiler
          key: gates

      - name: Build binaries and compile the SLEIGH specs
        run: make binaries specs

      - name: Lint the CLI and the base and numeric libraries
        run: make lint

      # `.sla` files are gitignored build artifacts and EVERY datatest decodes
      # through them. `make test` would bootstrap them on demand, but asserting
      # the tree is complete here turns a partial spec build into a clear
      # failure instead of a confusing corpus error.
      - name: Verify the compiled spec tree is complete
        run: |
          want=$(find specs -name '*.slaspec' | wc -l)
          got=$(find specs -name '*.sla' | wc -l)
          echo "compiled $got of $want .slaspec"
          if [ "$got" -ne "$want" ] || [ "$got" -eq 0 ]; then
            echo "::error::compiled $got .sla for $want .slaspec -- the spec tree is incomplete"
            exit 1
          fi

      - name: make test -- datatest corpus vs docs/baseline.json
        run: make test

      - name: make test-stages -- stage corpus vs docs/baseline-stages.json
        run: make test-stages

      - name: make check-spec
        run: make check-spec

      # The RE-friction loop's regression corpus (docs/re-pipeline.md). Every gap the loop
      # closes leaves the acceptance probe that proved the fix in tests/cli/; running them
      # here is what stops a closed need from silently re-opening. Needs no dataset -- every
      # case targets an in-repo fixture -- and an empty corpus passes.
      - name: make test-cli
        run: make test-cli

      - name: kuna catalog --check
        run: ./decompiler/target/release/kuna catalog --check

      # Shared-counter drift and ElementId collisions. Both are shapes that every
      # other gate passes cleanly: a stale hard-coded settable count only fails
      # whichever cargo test happens to assert it, and a duplicate ElementId fails
      # nothing at all -- three separate ones (4110, 4122, 4132) reached main before
      # this step existed, the last created by two concurrent builders in one round
      # each grepping for "the next free id" and getting the same answer. Two options
      # sharing an id compare EQUAL (ElementId's PartialEq is an id comparison), so
      # the first code that dispatches on one takes the wrong branch silently.
      - name: shared counters and ElementId uniqueness
        run: PYTHONPATH=$PWD python3 -m scripts.repipe.counters --check

      # `catalog --check` above proves options.md documents the same option SET;
      # this proves it is the generator's exact bytes. That is the assertion in
      # kuna-decomp/tests/options_md_fresh.rs, which lives in the workspace suite
      # -- skipped on an internal PR. Forgetting to regenerate options.md after
      # touching option metadata is a routine miss (AGENTS.md calls it out), so
      # the cheap job carries it rather than deferring it to the push to main.
      # Free: it reuses the release binary this job already built.
      - name: docs/options.md is the generator's bytes
        run: |
          ./decompiler/target/release/kuna catalog --markdown > /tmp/options.generated.md
          if ! diff -u docs/options.md /tmp/options.generated.md; then
            echo "::error file=docs/options.md::stale -- regenerate with 'decompiler/target/release/kuna catalog --markdown > docs/options.md'"
            exit 1
          fi

      # The ghidra-mode differential harness (docs/ghidra-integration.md §11):
      # drives the full decompile-process wire protocol in-process against real
      # vendored ELFs, with the mock-Java end answered from kuna's own analysis,
      # and pins the GUI-path quality numbers (placeholder rate, register/Unique
      # leaks, ghidra-vs-CLI diff ratio, query traffic). Lives in the workspace
      # suite too, but that job is skipped on internal PRs -- and a regression in
      # the GUI path is exactly what these pins exist to catch pre-merge. Cheap:
      # release profile over the deps `make binaries` already built (~2 min
      # compile, seconds of runtime). `--include-ignored` picks up the heavier
      # sort/grep breadth test that the dev-profile workspace run skips.
      - name: ghidra-sim differential harness (kuna-ghidra, release)
        run: |
          cd decompiler
          cargo test -p kuna-ghidra --release -- --include-ignored --nocapture

      # Node 22: the web suites below are written for (and only run on) a
      # current Node; the runner's default Node is not pinned. The suites that
      # drive headless Chrome (decompile-browser, -collab-browser, -collab-page,
      # -collab-rtc) are not run in CI, which is too costly for them; run them
      # locally (integrations/web/README.md -> Tests).
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The study view's pure modules need no build; run them before the
      # wasm build so a renderer or session regression answers in seconds.
      - name: Test the /decompile page's modules
        run: |
          node integrations/web/test/cdp-client-startup.mjs
          node integrations/web/test/decompile-render.mjs
          node integrations/web/test/decompile-wrap.mjs
          node integrations/web/test/decompile-session.mjs
          node integrations/web/test/decompile-bytes.mjs
          node integrations/web/test/decompile-learn.mjs
          node integrations/web/test/decompile-groups.mjs
          node integrations/web/test/decompile-strings.mjs
          node integrations/web/test/decompile-base64.mjs
          node integrations/web/test/decompile-collab.mjs
          node integrations/web/test/decompile-collab-cases.mjs
          node integrations/web/test/decompile-collab-sync.mjs
          node integrations/web/test/decompile-collab-fuzz.mjs

      - name: Assemble and test the browser Worker boundary
        run: |
          bash integrations/web/build.sh
          node integrations/web/test/worker.mjs
          node integrations/web/test/worker-errors.mjs
          node integrations/web/test/dev-viz.mjs
          node integrations/web/test/decompile-worker.mjs
          node integrations/web/test/decompile-replay.mjs

  rust-test:
    name: cargo workspace suite
    # Runs on: every push to main, manual dispatch, any PR from a FORK, and any
    # PR carrying the `full-ci` label. It is skipped only for a PR from a branch
    # in this repo -- the automated agent PRs, where AGENTS.md already requires
    # `make rust-test` green locally before the commit, so this job re-derives an
    # answer we have. Skipping it halves this workflow's runner demand per PR
    # and still leaves the parity gates (the cheap regression net) on every PR.
    #
    # The safety net for the skip is the `push: branches: [main]` trigger above:
    # the suite always runs on the merge commit, so nothing reaches main without
    # it -- the answer just arrives at merge rather than before it. To demand it
    # BEFORE merging a particular internal PR, add the `full-ci` label: that is
    # itself a trigger (see `types:` above), so the suite starts on the label
    # alone -- no push, no re-run, no workflow edit.
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.fork
      || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    # Full debug information across the test executables can fill the runner disk.
    # Keep backtrace line numbers and the workspace's debug/overflow checks.
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: decompiler
          key: rust-test-line-tables

      # Missing or unusable required processor specs fail the tests.
      - name: Compile the SLEIGH specs
        run: make specs

      - name: Verify the compiled spec tree is complete
        run: |
          want=$(find specs -name '*.slaspec' | wc -l)
          got=$(find specs -name '*.sla' | wc -l)
          echo "compiled $got of $want .slaspec"
          if [ "$got" -ne "$want" ] || [ "$got" -eq 0 ]; then
            echo "::error::compiled $got .sla for $want .slaspec -- the spec tree is incomplete"
            exit 1
          fi

      - name: make rust-test -- the full cargo workspace suite
        run: |
          df -h .
          make rust-test

      - name: Workspace build disk usage
        if: always()
        run: |
          df -h .
          if [ -d decompiler/target ]; then
            du -sh decompiler/target
          fi
